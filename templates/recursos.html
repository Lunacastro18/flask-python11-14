<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursos - Clase 1114</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        .navbar { background-color: #667eea; }
        .footer { background-color: #343a40; color: white; padding: 20px 0; margin-top: 40px; text-align: center; }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Clase 1114</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/informacion">Informacion</a></li>
                    <li class="nav-item"><a class="nav-link" href="/recursos">Recursos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/tareas">Tareas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/inscripcion">Inscripcion</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO -->
    <div class="container my-5">
        <h1 class="mb-4">Recursos de Aprendizaje</h1>
        <p class="lead">Enlaces utiles para complementar tu formacion en Python y Flask.</p>
        
        <div class="row">
            <div class="col-md-8">
                <div class="list-group">
                    {% for enlace in enlaces %}
                    <a href="{{ enlace.url }}" target="_blank" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1">{{ enlace.nombre }}</h5>
                            <small class="text-muted">Visitar sitio oficial</small>
                        </div>
                        <span class="badge bg-primary rounded-pill">Link →</span>
                    </a>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Portal Clase 1114</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
